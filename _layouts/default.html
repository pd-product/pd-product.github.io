<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- if site.noindex %}
    <meta name="robots" content="noindex">
    {%- endif %}
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32">
    <link rel="icon" href="{{ '/assets/favicon-512.png' | relative_url }}" sizes="512x512">
    <link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <!-- First focusable element on every page, and invisible until focused.
         Three nav items is a short thing to tab past, but on a story page the
         breadcrumb and the chapter rail sit ahead of the prose too. -->
    <a class="skip-link" href="#main">Skip to content</a>
    {% include nav.html %}
    <main class="content" id="main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    <!-- Reading state for the story chapter rail. Progressive enhancement: it
         exits immediately where there is no rail, and without it the rail is
         still a list of working anchor links. -->
    <script src="{{ '/assets/js/chapter-rail.js' | relative_url }}" defer></script>
  </body>
</html>
