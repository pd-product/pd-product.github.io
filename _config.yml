# Site metadata. TODO: replace the remaining placeholders with real copy.
title: "Patrick Diggins"
tagline: "TODO one-line positioning statement"
description: "TODO 1-2 sentence description used for search results and link previews."
author: "Patrick Diggins"

# Rendered by _includes/footer.html. Year of first publication, per the US
# Copyright Office's notice guidance; do not bump it annually.
copyright_year: 2026

# TODO: SET THIS TO false AT LAUNCH.
# The site is public and carries a real name, but the content is still
# placeholder. This emits <meta name="robots" content="noindex"> so search
# engines do not index a half-built page under that name.
# Deliberately NOT done with robots.txt: a Disallow rule stops the crawler
# fetching the page at all, so it never sees the noindex and the URL can still
# surface in results. The meta tag has to be reachable to be obeyed.
noindex: true

# User site: served from the domain root, so baseurl is empty.
# url must be set and absolute: jekyll-seo-tag uses it to build absolute
# share-card URLs, which is what makes a pasted link render a preview.
url: "https://pd-product.github.io"
baseurl: ""

# Contact is links only. There is no server, so there is no form.
email: "TODO you@example.com"
linkedin: "TODO https://www.linkedin.com/in/..."
resume: "/resume.pdf"

# Nav is data, not markup: edited here, rendered by _includes/nav.html.
# Two of the three are anchors on the home page, so they are written as
# absolute paths and work from story pages too.
nav:
  - title: "work"
    url: "/#work"
  - title: "about"
    url: "/#about"
  - title: "contact"
    url: "/#contact"

# Story pages. Add a file to _work/ and it gets a page, a URL, a home-page
# row, and prev/next placement. Nothing is hand-indexed.
# permalink :title uses the `slug` front matter key when present.
collections:
  work:
    output: true
    permalink: /work/:title/

defaults:
  - scope:
      path: ""
      type: "work"
    values:
      layout: "story"
  # Site-wide share-card default so no page is ever missing an image.
  # Any page or story may override with its own `image:`.
  - scope:
      path: ""
    values:
      image: "/assets/og/default.png"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
