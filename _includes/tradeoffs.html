{%- for table in include.tradeoffs %}
<dl class="tradeoffs" aria-label="Tradeoff comparison">
  {%- for row in table.rows %}
  <div class="trade-row">
    <dt class="trade-dimension">{{ row.dimension }}</dt>
    <dd><span class="trade-head">Rejected{% if forloop.first %} · {{ table.rejected }}{% endif %}</span>{{ row.rejected }}</dd>
    <dd><span class="trade-head">Chosen{% if forloop.first %} · {{ table.chosen }}{% endif %}</span>{{ row.chosen }}</dd>
  </div>
  {%- endfor %}
</dl>
{%- endfor %}
